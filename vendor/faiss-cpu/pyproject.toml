[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faiss-cpu"
version = "1.7.99"
description = "Numpy shim for faiss-cpu (Android/aarch64 compatible)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.hatch.build.targets.wheel]
packages = ["faiss"]
